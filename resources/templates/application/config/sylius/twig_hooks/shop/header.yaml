# The shop logo is rendered through the core brand slot (storefront_brand()),
# import only feeds it with data, see src/Import/Storefront/ImportBrandContributor.php.
sylius_twig_hooks:
    hooks:
        'sylius_shop.base.header.navbar':
            menu:
                enabled: false

        'sylius_shop.base.header.content':
            taxon_hamburger:
                enabled: false
